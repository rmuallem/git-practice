
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IT Support Portal</title>
</head>
<body>

    <h1>IT Support Portal</h1>

    <p>Describe your IT problem:</p>
    <input type="text" id="problem"
           placeholder="Enter your problem">

    <p>Select Priority:</p>
    <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>

    <button onclick="createTicket()">Create Ticket</button>

    <h2>Created Tickets</h2>
    <ul id="ticketList"></ul>

    <script>
        // Load saved tickets
        let tickets = JSON.parse(
            localStorage.getItem("tickets") || "[]"
        );

        let ticketNumber = Number(
            localStorage.getItem("ticketNumber") || 0
        );

        // Save tickets
        function saveTickets() {
            localStorage.setItem(
                "tickets",
                JSON.stringify(tickets)
            );

            localStorage.setItem(
                "ticketNumber",
                ticketNumber
            );
        }

        // Create a new ticket
        function createTicket() {
            let problem = document.getElementById("problem").value;
            let priority = document.getElementById("priority").value;

            if (problem.trim() === "") {
                alert("Please describe your problem.");
                return;
            }

            ticketNumber++;

            let ticket = {
                id: ticketNumber,
                problem: problem.trim(),
                priority: priority,
                status: "Open"
            };

            tickets.push(ticket);

            saveTickets();
            displayTickets();

            document.getElementById("problem").value = "";
        }

        // Display all tickets
        function displayTickets() {
            let ticketList = document.getElementById("ticketList");

            ticketList.innerHTML = "";

            tickets.forEach(function(ticket) {
                let newTicket = document.createElement("li");

                let ticketText = document.createElement("span");

                ticketText.textContent =
                    "Ticket #" + ticket.id +
                    " - Problem: " + ticket.problem +
                    " - Priority: " + ticket.priority +
                    " - Status: " + ticket.status + " ";

                let resolveButton = document.createElement("button");
                resolveButton.textContent = "Resolve";

                if (ticket.status === "Resolved") {
                    resolveButton.disabled = true;
                }

                resolveButton.onclick = function() {
                    ticket.status = "Resolved";
                    saveTickets();
                    displayTickets();
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {
                    tickets = tickets.filter(function(item) {
                        return item.id !== ticket.id;
                    });

                    saveTickets();
                    displayTickets();
                };

                newTicket.appendChild(ticketText);
                newTicket.appendChild(resolveButton);
                newTicket.appendChild(
                    document.createTextNode(" ")
                );
                newTicket.appendChild(deleteButton);

                ticketList.appendChild(newTicket);
            });
        }

        // Display saved tickets when page opens
        displayTickets();

    </script>

</body>
</html>
