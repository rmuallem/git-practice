
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IT Support Portal</title>
</head>
<body>

    <h1>IT Support Portal</h1>

    <p>Describe your IT problem:</p>
    <input type="text" id="problem"
           placeholder="Enter your problem">

    <p>Select Priority:</p>
    <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>

    <button onclick="createTicket()">Create Ticket</button>

    <h2>Created Tickets</h2>
    <ul id="ticketList"></ul>

    <script>
        let ticketNumber = 0;

        function createTicket() {
            let problem = document.getElementById("problem").value;
            let priority = document.getElementById("priority").value;

            if (problem.trim() === "") {
                alert("Please describe your problem.");
                return;
            }

            ticketNumber++;

            let ticketList = document.getElementById("ticketList");
            let newTicket = document.createElement("li");

            let ticketText = document.createElement("span");
            ticketText.textContent = "Ticket #" + ticketNumber +
                " - Problem: " + problem +
                " - Priority: " + priority + " - Status: ";

            let ticketStatus = document.createElement("span");
            ticketStatus.textContent = "Open";

            let resolveButton = document.createElement("button");
            resolveButton.textContent = "Resolve";

            resolveButton.onclick = function() {
                ticketStatus.textContent = "Resolved";
                resolveButton.disabled = true;
            };

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {
                newTicket.remove();
            };

            newTicket.appendChild(ticketText);
            newTicket.appendChild(ticketStatus);
            newTicket.appendChild(document.createTextNode(" "));
            newTicket.appendChild(resolveButton);
            newTicket.appendChild(document.createTextNode(" "));
            newTicket.appendChild(deleteButton);

            ticketList.appendChild(newTicket);

            document.getElementById("problem").value = "";
        }
    </script>

</body>
</html>
